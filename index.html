<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10141a" />
    <title>NIGHT AUDIT — Loop 7</title>
    <style>
      /* Critical paint only; full UI styles load with the bundle. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10141a;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #c9c6bc;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 400ms ease;
        z-index: 50;
      }
      #boot-splash .mark {
        font-size: 20px;
        letter-spacing: 0.4em;
        color: #e8a33d;
      }
      #boot-splash .bar {
        width: 180px;
        height: 2px;
        background: #2a2e35;
        overflow: hidden;
      }
      #boot-splash .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: #e8a33d;
        transition: width 200ms ease;
      }
      #boot-splash.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark">NIGHT AUDIT</div>
      <div class="sub">Civic Works Authority · Route Integrity</div>
      <div class="bar"><i id="boot-bar"></i></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
